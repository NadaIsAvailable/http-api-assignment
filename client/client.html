<!DOCTYPE html>
<html lang="en">
<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  
  <script>
    const handleResponse = async (response, accept) => {
      const content = document.querySelector('#content');
      
      switch(response.status) {
        case 200:
          content.innerHTML = `<h1>Success</h1>`;
          break;
        case 400:
          content.innerHTML = '<h1>Bad Request</h1>';
          break;
        case 401:
          content.innerHTML = '<h1>Unauthorized</h1>';
          break;
        case 403:
          content.innerHTML = `<h1>Forbidden</h1>`;
          break;
        case 500:
          content.innerHTML = `<h1>Internal Server Error</h1>`;
          break;
        case 501:
          content.innerHTML = `<h1>Not Implemented</h1>`;
          break;
        default: 
          content.innerHTML = `<h1>Resource Not Found</h1>`;
          break;
      }

      if (accept === 'application/json') {
        const obj = await response.json();

        console.log(obj);

        if (obj.message) {
          content.innerHTML += `<p>Message: ${obj.message}</p>`;
        }
      } else {
        const xmlString = await response.text();

        console.log(xmlString);

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, "text/xml");

        const message = xmlDoc.getElementsByTagName('message')[0].textContent;
        content.innerHTML += `<p>Message: ${message}</p>`;

        if (xmlDoc.getElementsByTagName('id')) {
          const id = xmlDoc.getElementsByTagName('id')[0].textContent;
          content.innerHTML += `<p>ID: ${id}</p>`;
        }
      }
    }

    const init = () => {
      const sendBtn = document.querySelector('#send');

      sendBtn.addEventListener('click', async () => {
        const pathname = document.querySelector('#page').value;
        const accept = document.querySelector('#type').value;

        const res = await fetch(pathname, {
          headers: {
            'Accept': accept,
          },
        });

        handleResponse(res, accept);
      })
    }

    window.onload = init;
  </script>
</head>
<body>
  <section id="top">
    <h3>Status Code Tests</h3>
    <select id="page">
      <option value="/success">Success</option>
      <option value="/badRequest">Bad Request</option>
      <option value="/unauthorized">Unauthorized</option>
      <option value="/forbidden">Forbidden</option>
      <option value="/internal">Internal</option>
      <option value="/notImplemented">Not Implemented</option>
      <option value="/notFound">Not Found</option>
    </select>
    <select id="type">
      <option value="application/json">JSON</option>
      <option value="text/xml">XML</option>
    </select>
    <button id="send">Send</button>
  </section>
  <section id="content">
  </section>
</body>
</html>
